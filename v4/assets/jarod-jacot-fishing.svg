<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">Jarod Jacot Fishing</title>
  <desc id="desc">Écusson original de pêche sportive : brochet stylisé, ligne, vagues et couleurs turquoise, crème, anthracite et rouge du bateau.</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#29c5bd"/>
      <stop offset="1" stop-color="#087873"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="0.6" stop-color="#e5dcc6"/>
      <stop offset="1" stop-color="#aabbb0"/>
    </linearGradient>
    <clipPath id="badge-clip"><circle cx="380" cy="380" r="348"/></clipPath>
  </defs>
  <circle cx="380" cy="380" r="367" fill="#17232b" stroke="#f1e8d5" stroke-width="12"/>
  <circle cx="380" cy="380" r="347" fill="none" stroke="#119b95" stroke-width="7"/>
